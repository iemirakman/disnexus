name: DisNexus Multiplatform Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: DisNexus-macOS.dmg
            script: |
              fyne package -os darwin -icon internal/gui/assets/disnexus.png -appID com.disnexus.app
              hdiutil create -volname DisNexus -srcfolder DisNexus.app -ov -format UDZO DisNexus-macOS.dmg
          - os: windows-latest
            artifact: DisNexus.exe
            script: |
              fyne package -os windows -icon internal/gui/assets/disnexus.png -appID com.disnexus.app
          - os: ubuntu-latest
            artifact: DisNexus.tar.gz
            script: |
              fyne package -os linux -icon internal/gui/assets/disnexus.png -appID com.disnexus.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev

      - name: Install Fyne CLI (Updated Path)
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Build Package
        run: ${{ matrix.script }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}