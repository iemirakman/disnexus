name: DisNexus Auto Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build macOS Binary
        run: |
          go build -ldflags="-s -w" -o DisNexus.app/Contents/MacOS/disnexus ./cmd/disnexus

      - name: Construct .app Bundle
        run: |
          mkdir -p DisNexus.app/Contents/Resources
          cp internal/gui/assets/disnexus.png DisNexus.app/Contents/Resources/icon.png
          cat << 'EOF' > DisNexus.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>disnexus</string>
              <key>CFBundleIconFile</key>
              <string>icon.png</string>
              <key>CFBundleIdentifier</key>
              <string>com.disnexus.app</string>
              <key>CFBundleName</key>
              <string>DisNexus</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSUIElement</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Create DMG Package
        run: |
          hdiutil create -volname DisNexus -srcfolder DisNexus.app -ov -format UDZO DisNexus-macOS.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisNexus-macOS.dmg
          path: DisNexus-macOS.dmg

  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Windows Binary
        run: |
          go build -ldflags="-H windowsgui -s -w" -o DisNexus.exe ./cmd/disnexus

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisNexus.exe
          path: DisNexus.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libwayland-dev libxkbcommon-dev

      - name: Build Linux Binary
        run: |
          go build -ldflags="-s -w" -o disnexus-linux ./cmd/disnexus
          tar -czvf DisNexus-Linux.tar.gz disnexus-linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DisNexus-Linux.tar.gz
          path: DisNexus-Linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Semantic Version Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: DisNexus ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          make_latest: true
          files: ./release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
